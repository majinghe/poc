<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客户 PoC 调研表</title>
  <link rel="icon" type="image/png" href="assets/favicon-32x32.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- 登录门禁 -->
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-card" autocomplete="off">
      <img class="login-logo" src="assets/rustfs-logo.svg" alt="RustFS" />
      <h1 class="login-title">客户 PoC 调研表</h1>
      <p class="login-sub">客户环境与需求收集（售前 / PoC）</p>
      <label class="login-field"><span>用户名</span>
        <input id="login-user" class="inp" type="text" autocomplete="username" required /></label>
      <label class="login-field"><span>密码</span>
        <input id="login-pass" class="inp" type="password" autocomplete="current-password" required /></label>
      <p id="login-error" class="login-error hidden">用户名或密码错误</p>
      <button class="btn btn-primary login-btn" type="submit">登 录</button>
    </form>
  </div>

  <header class="topbar">
    <div class="brand">
      <img class="logo" src="assets/rustfs-logo.svg" alt="RustFS" />
      <span class="brand-title">客户 PoC 调研表</span>
      <span class="brand-sub">客户环境与需求收集（售前 / PoC）</span>
    </div>
    <div class="actions">
      <span id="whoami" class="save-hint"></span>
      <span id="save-hint" class="save-hint"></span>
      <button id="btn-restore" class="btn btn-ghost" type="button">恢复草稿</button>
      <button id="btn-clear" class="btn btn-ghost" type="button">清空</button>
      <button id="btn-submit" class="btn btn-primary" type="button">提交并生成 PDF</button>
      <button id="btn-logout" class="btn btn-ghost" type="button">退出</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-title">目录</div>
      <ol id="toc" class="toc"></ol>
      <div class="sidebar-foot">
        <div id="progress" class="progress">必填完成 0 / 9</div>
      </div>
    </nav>

    <main class="content">
      <div id="result" class="result hidden">
        <div class="result-head">
          <h2>PDF 已生成<span id="pdf-note" class="pdf-note"></span></h2>
          <div class="result-actions">
            <a id="btn-download" class="btn btn-primary" download href="#">下载 PDF</a>
            <button id="btn-back" class="btn btn-ghost" type="button">返回修改</button>
          </div>
        </div>
        <iframe id="pdf-frame" title="PDF 预览"></iframe>
      </div>

      <form id="survey" class="survey" autocomplete="off"></form>

      <footer class="foot">
        *文档结束 —— 《客户 PoC 调研表》｜客户环境与需求收集（售前 / PoC）*
      </footer>
    </main>
  </div>

  <!-- 离屏容器：浏览器端生成 PDF 时的排版源。
       外壳 .pdf-src 负责移出屏幕；#pdf-src 是 html2pdf 的克隆源，不能带定位类，
       否则克隆节点继承离屏样式会逃出捕获容器，产出空白 PDF。 -->
  <div class="pdf-src" aria-hidden="true"><div id="pdf-src"></div></div>

  <script src="vendor/html2pdf.bundle.min.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/pdf-template.js"></script>
  <script src="js/form-render.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
